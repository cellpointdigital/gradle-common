dependencies {
    constraints {
        // Enforce a minimum Log4j 2.x version to prevent vulnerable transitive versions.
        def rules = {
            version {
                strictly("[2.20.0, 3[") // there is a catastrophic bug in versions prior to 2.20.0
                prefer("2.26.1")
            }
        }
        implementation("org.apache.logging.log4j:log4j-core", rules)
        implementation("org.apache.logging.log4j:log4j-api", rules)
        implementation("org.apache.logging.log4j:log4j-to-slf4j", rules)
    }

    modules {
        module("com.google.guava:listenablefuture") {
            replacedBy("com.google.guava:guava", "listenablefuture is part of guava")
        }
    }

}

