/**
 * Gets information from GIT and put it into ext.gitDetails property as instance of GitInfo
 */
class GitInfo {
    String branchName
    String commitId
    String closestTagName
    boolean dirty
    List<String> tags

    GitInfo(String branchName, String commitId, String closestTagName, boolean dirty, List<String> tags) {
        this.branchName = branchName
        this.commitId = commitId
        this.closestTagName = closestTagName
        this.dirty = dirty
        this.tags = dirty ? [] : tags
    }
}

// works as a source of some value
abstract class GitInfoValueSource implements ValueSource<GitInfo, None> {

    private static final String DIRTY_MARK = "**DIRTY**"
    private GitInfo info

    // most likely, this function is resolved by `providers.of(GitInfoValueSource.class)`
    @Inject
    abstract ExecOperations getExecOperations()

    private String run(String... command) {
        final ByteArrayOutputStream output = new ByteArrayOutputStream()
        execOperations.exec {
            it.commandLine command
            it.standardOutput = output
            it.ignoreExitValue = true
        }
        return (new String(output.toByteArray())).trim()
    }

    GitInfo obtain() {
        if (info == null) {
            String latestTag = run("git", "describe", "--tags", "--abbrev=0", "--dirty="+DIRTY_MARK)
            List<String> tags = run("git", "tag", "--contains", "HEAD").tokenize('\n')
            info = new GitInfo(
                    run("git", "rev-parse", "--abbrev-ref", "HEAD"),
                    run("git", "rev-parse", "HEAD"),
                    latestTag.replace(DIRTY_MARK, ""),
                    latestTag.contains(DIRTY_MARK),
                    tags
            )
        }
        return info
    }
}

def gitInfoProvider = providers.of(GitInfoValueSource.class) {}
GitInfo gitInfo = gitInfoProvider.get()

println "GIT"
println "  branchName: ${gitInfo.branchName}"
println "  commitId: ${gitInfo.commitId}"
println "  tags: ${gitInfo.tags}"
println "  closestTagName: ${gitInfo.closestTagName}"
println "  dirty: ${gitInfo.dirty}"

// expose this value globally
ext.gitDetails = gitInfo

tasks.register('updateAddons', Task) {
    group = 'git'
    description = 'Update "addons" submodule from remote origin server.'
    doLast {
        "git submodule update -f --remote addons".execute()
        "git add addons".execute()
    }
}
